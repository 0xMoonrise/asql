<!DOCTYPE html>
<html>
<head>
    <title>Asql</title>
    <script src="/js/htmx.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .editor-wrapper {
            display: flex;
            border: 1px solid var(--pico-form-element-border-color);
            border-radius: var(--pico-border-radius);
            overflow: hidden;
            background: var(--pico-form-element-background-color);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5rem;
        }

        .editor-wrapper:focus-within {
            border-color: var(--pico-form-element-active-border-color);
            box-shadow: 0 0 0 var(--pico-outline-width) var(--pico-form-element-focus-color);
        }

        #line-numbers {
            background: var(--pico-code-background-color, #1a1a2e);
            color: var(--pico-muted-color);
            padding: 0.6rem 0.5rem;
            text-align: right;
            user-select: none;
            min-width: 2.8rem;
            overflow: hidden;
            border-right: 1px solid var(--pico-form-element-border-color);
            opacity: 0.6;
        }

        #line-numbers span {
            display: block;
            line-height: 1.5rem;
        }

        textarea[name="text"] {
            flex: 1;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
            padding: 0.6rem 0.75rem !important;
            font-family: 'Courier New', monospace !important;
            font-size: 0.9rem !important;
            line-height: 1.5rem !important;
            resize: none;
            background: transparent !important;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Asql</h1>
        <form>
          <div class="editor-wrapper">
            <div id="line-numbers"><span>1</span></div>
            <textarea name="text" rows="8" spellcheck="false"></textarea>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
            <button type="button"
                    hx-post="/asql"
                    hx-include="[name='text']"
                    hx-target="#result"
                    style="width: auto;">Run all</button>
            <button type="button"
                    hx-post="/lexer"
                    hx-include="[name='text']"
                    hx-target="#result"
                    style="width: auto;">Lexer</button>
          </div>
        </form>
        <div id="result"></div>
    </main>

    <script>
        const textarea = document.querySelector('textarea[name="text"]');
        const lineNumbers = document.getElementById('line-numbers');

        function updateLineNumbers() {
            const count = textarea.value.split('\n').length;
            lineNumbers.innerHTML = Array.from({ length: count }, (_, i) => `<span>${i + 1}</span>`).join('');
        }

        function syncScroll() {
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        textarea.addEventListener('input', updateLineNumbers);
        textarea.addEventListener('scroll', syncScroll);

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const s = textarea.selectionStart;
                textarea.value = textarea.value.substring(0, s) + '  ' + textarea.value.substring(textarea.selectionEnd);
                textarea.selectionStart = textarea.selectionEnd = s + 2;
                updateLineNumbers();
            }
        });

        updateLineNumbers();
    </script>
</body>
</html>
