services:
  asql:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.asql
    container_name: asql
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    networks:
      - internal
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.st
    container_name: asql-streamlit
    environment:
      - APP_URL=http://asql:8080
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - asql

  caddy:
    image: caddy:alpine
    container_name: asql-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_certs:/etc/caddy/certs
    networks:
      - internal
      - public
    restart: unless-stopped
    depends_on:
      - streamlit

volumes:
  caddy_data:
  caddy_certs:

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
