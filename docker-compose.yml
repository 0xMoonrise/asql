services:
  app:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.app
    container_name: asql-app
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    networks:
      - internal
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.st
    container_name: asql-streamlit
    ports:
      - "8501:8501"
    environment:
      - APP_URL=http://app:8080
    networks:
      - internal
      - public
    restart: unless-stopped
    depends_on:
      - app

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
